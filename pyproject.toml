[project]
name = "sd-xl"
version = "0.1.0"
description = "Generador de imagenes con Stable Diffusion XL (diffusers + PyTorch)"
readme = "README.md"
authors = [
    { name = "sebasblaster", email = "johsemed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
sd-xl = "sd_xl:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
